<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake by Xzyqrn</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <header class="game-header">
                <div class="title-container">
                    <h1 class="game-title">Snake</h1>
                    <span class="game-author">by Xzyqrn</span>
                </div>
                <div class="game-controls">
                    <button id="theme-toggle" class="control-btn" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <button id="pause-btn" class="control-btn" aria-label="Pause game">
                        <span class="pause-icon">⏸️</span>
                    </button>
                </div>
            </header>
            
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">High Score</span>
                    <span id="high-score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level</span>
                    <span id="level" class="stat-value">1</span>
                </div>
            </div>
            
            <div class="game-board-container">
                <canvas id="game-canvas" width="600" height="600"></canvas>
                <div id="game-overlay" class="game-overlay hidden">
                    <div class="overlay-content">
                        <h2 id="overlay-title">Game Over</h2>
                        <p id="overlay-message">Your score: <span id="final-score">0</span></p>
                        <div class="overlay-buttons">
                            <button id="restart-btn" class="primary-btn">Play Again</button>
                            <button id="menu-btn" class="secondary-btn">Menu</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="game-instructions">
                <p>Use <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or swipe to control the snake</p>
            </div>
            
            <div class="skin-selector">
                <h3>Snake Skin</h3>
                <div class="skin-options">
                    <button class="skin-option active" data-skin="classic">Classic</button>
                    <button class="skin-option" data-skin="neon">Neon</button>
                    <button class="skin-option" data-skin="gradient">Gradient</button>
                    <button class="skin-option" data-skin="rainbow">Rainbow</button>
                </div>
            </div>
        </div>
        
        <div class="background-effects">
            <div class="parallax-layer layer-1"></div>
            <div class="parallax-layer layer-2"></div>
            <div class="parallax-layer layer-3"></div>
        </div>
    </div>
    
    <script type="module" src="src/main.ts"></script>
</body>
</html>
